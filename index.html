<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header class="navbar">
    <div class="container">
      <h1 class="logo">📚 Notes Portal</h1>

     <div class="menu-toggle" id="menu-toggle">
  <i class="fas fa-bars"></i>
</div>
      <!-- Navigation Links -->
      <ul class="nav-links" id="nav-links">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </header>

  <main class="main-content">
    <h2>Select Your Semester</h2>
    <div class="semester-list">
      <a href="semester.html?sem=1" class="semester-link">Semester 1</a>
      <a href="semester.html?sem=2" class="semester-link">Semester 2</a>
      <a href="semester.html?sem=3" class="semester-link">Semester 3</a>
      <a href="semester.html?sem=4" class="semester-link">Semester 4</a>
      <a href="semester.html?sem=5" class="semester-link">Semester 5</a>
      <a href="semester.html?sem=6" class="semester-link">Semester 6</a>
      <a href="semester.html?sem=7" class="semester-link">Semester 7</a>
      <a href="semester.html?sem=8" class="semester-link">Semester 8</a>
    </div>

    <section id="about" class="about-section">
      <h2>About Notes Portal</h2>
      <p><strong>Notes Portal</strong> is a simple and efficient semester-wise platform...</p>
    </section>

    <section id="contact" class="contact-section">
      <h2>Contact Us</h2>
      <form class="contact-form">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="social-icons">
      <a href="#"><i class="fab fa-facebook"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-linkedin"></i></a>
      <a href="#"><i class="fab fa-github"></i></a>
    </div>
    <p>&copy; 2025 Notes Portal. All rights reserved.</p>
  </footer>

  <!-- Hamburger Menu Script -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const toggle = document.getElementById("menu-toggle");
      const navLinks = document.getElementById("nav-links");

      toggle.addEventListener("click", function () {
        navLinks.classList.toggle("active");
      });
    });
  </script>
</body>
</html>
